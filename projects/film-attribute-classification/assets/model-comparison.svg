<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 800 460">
  <title id="title">Film attribute classification model comparison</title>
  <desc id="desc">RoBERTa achieved the best validation weighted F1 of 0.6253, followed by the DeBERTa ensemble at 0.6142 and BiLSTM with attention at 0.5845.</desc>
  <rect width="800" height="460" rx="24" fill="#f8fafc"/>
  <text x="48" y="54" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Film Attribute Classification</text>
  <text x="48" y="84" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Validation weighted F1</text>

  <line x1="220" y1="382" x2="720" y2="382" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#64748b" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="220" y="406">0.0</text>
    <text x="363" y="406">0.2</text>
    <text x="506" y="406">0.4</text>
    <text x="649" y="406">0.6</text>
    <text x="720" y="406">0.7</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="363" y1="112" x2="363" y2="382"/>
    <line x1="506" y1="112" x2="506" y2="382"/>
    <line x1="649" y1="112" x2="649" y2="382"/>
    <line x1="720" y1="112" x2="720" y2="382"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="200" y="165" fill="#334155" font-size="16" text-anchor="end">BiLSTM + attention</text>
    <rect x="220" y="136" width="417.5" height="44" rx="8" fill="#94a3b8"/>
    <text x="650" y="165" fill="#334155" font-size="18" font-weight="700">0.5845</text>

    <text x="200" y="255" fill="#334155" font-size="16" text-anchor="end">RoBERTa-base</text>
    <rect x="220" y="226" width="446.6" height="44" rx="8" fill="#2563eb"/>
    <text x="679" y="255" fill="#1d4ed8" font-size="18" font-weight="700">0.6253</text>

    <text x="200" y="345" fill="#334155" font-size="16" text-anchor="end">DeBERTa-v3 ensemble</text>
    <rect x="220" y="316" width="438.7" height="44" rx="8" fill="#0f766e"/>
    <text x="671" y="345" fill="#0f766e" font-size="18" font-weight="700">0.6142</text>
  </g>

  <rect x="536" y="22" width="194" height="62" rx="14" fill="#dbeafe"/>
  <text x="633" y="48" fill="#1e40af" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Best validation model</text>
  <text x="633" y="71" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">RoBERTa-base</text>
</svg>
